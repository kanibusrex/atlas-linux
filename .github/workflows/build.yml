# Builds Atlas for Windows (an installer) and macOS (a disk image) on every push, checks the file work on
# each, starts the app and takes pictures of it. A v* tag also attaches both to that tag's release.
name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pywebview and PyInstaller
        run: python -m pip install -r requirements.txt pyinstaller==6.11.1

      - name: Check the file work
        run: python tests/smoke_core.py

      - name: Try an update from the newest release
        run: python tests/update_check.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # from the source, with a console: if the built app fails, this says whether it's the app or the build
      - name: Start it from the source
        shell: pwsh
        continue-on-error: true
        run: |
          $env:ATLAS_DEBUG = "1"
          $p = Start-Process python -ArgumentList "atlas.py", "C:\Windows" -PassThru -RedirectStandardError source-err.txt -RedirectStandardOutput source-out.txt
          Start-Sleep 20
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force }
          "still running after 20 s: $alive"
          Get-Content source-err.txt, source-out.txt -ErrorAction SilentlyContinue
          if (-not $alive) { exit 1 }

      - name: Build Atlas.exe
        run: >
          pyinstaller --noconfirm --windowed --name Atlas --icon atlas.ico
          --add-data "atlas.html;." --add-data "AtlasCore.ps1;." --add-data "atlas.ico;."
          --exclude-module atlas_linux --exclude-module atlas_core_linux --exclude-module gi
          --exclude-module atlas_mac --exclude-module atlas_core_mac
          atlas.py

      - name: Start it and take pictures
        shell: pwsh
        run: ./tests/try-windows.ps1

      - name: Make the installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          $v = (Select-String -Path atlas.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$v" windows\atlas.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-windows
          path: |
            dist/Atlas-*-setup.exe
            try/

      # never replaces a file a release already has: a new version gets a new tag
      - name: Attach the installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" (Get-Item dist\Atlas-*-setup.exe).FullName

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pywebview and PyInstaller
        run: python -m pip install -r requirements.txt pyinstaller==6.11.1 pillow

      - name: Check the file work
        run: python tests/smoke_core.py

      - name: Try an update from the newest release
        run: python tests/update_check.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build Atlas.app
        run: >
          pyinstaller --noconfirm --windowed --name Atlas --icon atlas.png
          --osx-bundle-identifier dev.atlas.Atlas
          --add-data "atlas.html:." --add-data "atlas.png:."
          --exclude-module atlas_linux --exclude-module atlas_core_linux --exclude-module gi
          --exclude-module atlas_windows --exclude-module atlas_core_windows
          atlas.py

      - name: Start it and take pictures
        run: ./tests/try-mac.sh

      # a disk image: Atlas, and a shortcut to Applications to drag it onto
      - name: Make the disk image
        run: |
          v=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' atlas.py)
          mkdir -p build/dmg && cp -R dist/Atlas.app build/dmg/ && ln -sf /Applications build/dmg/Applications
          hdiutil create -volname Atlas -srcfolder build/dmg -ov -format UDZO "dist/Atlas-$v-mac-arm64.dmg"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-mac
          path: |
            dist/Atlas-*-mac-arm64.dmg
            try/

      # never replaces a file a release already has: a new version gets a new tag
      - name: Attach the disk image to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/Atlas-*-mac-arm64.dmg
